name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and mock protocol tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # cabal-install 3.12 can start a test suite before sibling libraries it
      # does not depend on are registered, and then fails to find them.
      - name: Build all components
        run: nix develop --no-write-lock-file .#unit --command cabal build all

      - name: Run ordinary test suite
        run: nix develop --no-write-lock-file .#unit --command cabal test all

      - name: Reject requests in the wrong sequence phase
        run: nix develop --no-write-lock-file .#unit --command bash ci/check-phase-types.sh

      - name: Check source distribution and public documentation
        run: nix develop --no-write-lock-file .#unit --command ci/check-package.sh

  integration:
    name: Real river integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Record pinned component versions
        run: |
          mkdir -p artifacts/integration
          nix eval --no-write-lock-file --json .#integrationVersions.x86_64-linux \
            | tee artifacts/integration/component-versions.json

      - name: Run enabled integration release check
        run: nix develop --no-write-lock-file .#ci --command ci/run-integration.sh

      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-river-integration
          path: artifacts/integration
          if-no-files-found: warn
          retention-days: 14
